<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UntungCerdas</title>
<meta name="description" content="Game literasi matematika persentase untung dan rugi dengan model Rigorous Mathematical Thinking (RMT) dan tutor AI Google Gemini. Logika game ditulis dengan Python dan dijalankan di browser dengan Pyodide.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
<style>
  :root {
    --bg: #EEF5FD; --kartu: #FFFFFF; --lembut: #E3EEFB; --garis: #C9DCF2;
    --teks: #1C2B3A; --redup: #5B6B7D; --utama: #1E6FD9; --hijau: #2E9E5B;
    --merah: #D64545; --biru: #0B4F9C; --langit: #1590C9; --nila: #4B63D1;
    --hijau-muda: #DFF3E6; --merah-muda: #FBE3E3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1724; --kartu: #172234; --lembut: #1E2D44; --garis: #2C3F5C;
      --teks: #E6EEF8; --redup: #9DB0C8; --hijau-muda: #1F3B2B; --merah-muda: #43262A; --biru: #5B9BEA;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1724; --kartu: #172234; --lembut: #1E2D44; --garis: #2C3F5C;
    --teks: #E6EEF8; --redup: #9DB0C8; --hijau-muda: #1F3B2B; --merah-muda: #43262A; --biru: #5B9BEA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--teks);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; line-height: 1.5;
  }
  .wadah { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  .tengah { text-align: center; }
  h1 { color: var(--utama); font-size: 2.6rem; margin: 0; }
  .sub { color: var(--redup); margin: 4px 0 20px; }
  .kecil { font-size: .85rem; color: var(--redup); }
  .tombol {
    display: inline-block; border: 0; border-radius: 6px; padding: 12px 22px; cursor: pointer;
    font-family: inherit; font-weight: 600; font-size: 1rem; color: #fff; background: var(--utama);
  }
  .tombol:hover:not(:disabled) { filter: brightness(1.08); }
  .tombol:disabled { opacity: .45; cursor: not-allowed; }
  .tombol:focus-visible, input:focus-visible, .opsi:focus-within { outline: 3px solid var(--biru); outline-offset: 2px; }
  .langit { background: var(--langit); } .biru { background: var(--biru); }
  .nila { background: var(--nila); } .abu { background: #5B6B7D; }
  .menu-tombol { display: flex; flex-direction: column; gap: 10px; max-width: 340px; margin: 0 auto; }
  .nama { margin-bottom: 18px; }
  .nama input, .isian input {
    font: inherit; padding: 8px 10px; border: 1px solid var(--garis); border-radius: 6px;
    background: var(--kartu); color: var(--teks);
  }
  .kartu { background: var(--kartu); border: 1px solid var(--garis); border-radius: 10px; padding: 18px 20px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .bar b { font-size: 1.05rem; }
  .skor { color: var(--utama); font-weight: 700; }
  .grid { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 14px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 2rem; } }
  .lencana { display: inline-block; color: #fff; font-weight: 700; font-size: .78rem; padding: 3px 8px; border-radius: 4px; }
  .judul-misi { font-size: 1.25rem; margin: 10px 0 6px; }
  .tahapan { list-style: none; padding: 0; margin: 8px 0 0; font-size: .92rem; }
  .tahapan li { padding: 2px 0; color: var(--redup); }
  .tahapan li.aktif { color: var(--utama); font-weight: 700; }
  .tahapan li.ok { color: var(--hijau); } .tahapan li.salah { color: var(--merah); }
  .judul-tahap { color: var(--utama); font-size: 1.25rem; margin: 0; }
  .isian { display: flex; align-items: center; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  .isian label { min-width: 220px; }
  .isian input { width: 160px; font-size: 1.05rem; }
  .tanda { font-weight: 700; }
  .opsi {
    display: flex; gap: 10px; align-items: flex-start; background: var(--lembut); border-radius: 8px;
    padding: 10px 12px; margin: 6px 0; cursor: pointer; white-space: pre-line; border: 2px solid transparent;
  }
  .opsi input { margin-top: 5px; }
  .opsi.benar { background: var(--hijau-muda); border-color: var(--hijau); color: var(--hijau); }
  .opsi.keliru { background: var(--merah-muda); border-color: var(--merah); color: var(--merah); }
  .hasil { font-weight: 700; font-size: 1.1rem; margin: 14px 0 4px; min-height: 1.5em; }
  .bahas { white-space: pre-line; background: var(--lembut); border-radius: 8px; padding: 10px 12px; }
  .aksi { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--garis); vertical-align: top; }
  th { color: var(--redup); font-weight: 600; }
  .bintang { color: var(--utama); letter-spacing: 2px; white-space: nowrap; }
  .tabel-gulir { overflow-x: auto; }
  .materi { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 14px; }
  @media (max-width: 760px) { .materi { grid-template-columns: 1fr; } }
  .materi nav button {
    display: block; width: 100%; text-align: left; border: 0; background: var(--kartu); color: var(--teks);
    padding: 10px 12px; margin-bottom: 4px; border-radius: 6px; cursor: pointer; font: inherit;
  }
  .materi nav button.aktif { background: var(--biru); color: #fff; }
  .materi pre { white-space: pre-wrap; font-family: Consolas, "Courier New", monospace; font-size: .95rem; margin: 0; }
  .muat { padding: 80px 0; }
  .spinner { width: 44px; height: 44px; border: 5px solid var(--garis); border-top-color: var(--utama);
    border-radius: 50%; margin: 0 auto 16px; animation: putar 1s linear infinite; }
  @keyframes putar { to { transform: rotate(360deg); } }
  .catatan { margin-top: 28px; }
  .tersembunyi { display: none !important; }
  .rmt-kotak { background: var(--lembut); border-radius: 8px; padding: 8px 12px; margin: 8px 0 4px; font-size: .88rem; }
  .rmt-kotak b { color: var(--biru); }
  .mediasi { white-space: pre-line; background: color-mix(in srgb, var(--nila) 12%, var(--kartu)); border-left: 4px solid var(--nila); border-radius: 8px; padding: 10px 12px; margin: 6px 0; }
  .ai { white-space: pre-line; background: var(--lembut); border-left: 4px solid var(--utama); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
  .bagian h3 { color: var(--biru); font-size: 1.02rem; margin: 14px 0 2px; }
  .bagian p { margin: 0; }
  .pilihan-refleksi label { display: block; padding: 4px 0; cursor: pointer; }
  .profil-baris { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr) 90px; gap: 10px; align-items: center; margin: 6px 0; font-size: .92rem; }
  @media (max-width: 760px) { .profil-baris { grid-template-columns: 1fr; gap: 2px; } }
  .batang { height: 12px; background: var(--garis); border-radius: 6px; overflow: hidden; }
  .batang span { display: block; height: 100%; background: var(--utama); }
  .lapisan { position: fixed; inset: 0; background: rgba(10, 20, 40, .55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .dialog { background: var(--kartu); color: var(--teks); border-radius: 12px; padding: 20px; max-width: 520px; width: 100%; max-height: 90vh; overflow: auto; }
  .dialog label { display: block; margin-top: 10px; font-weight: 600; }
  .dialog input, .dialog select { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--garis); border-radius: 6px; background: var(--kartu); color: var(--teks); }
</style>
</head>
<body>
<main class="wadah" id="app">
  <div class="tengah muat">
    <div class="spinner"></div>
    <p><b>Memuat UntungCerdas…</b></p>
    <p class="kecil">Menyiapkan Python di browser (sekitar 5–20 detik pada pembukaan pertama).</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const WARNA = ["var(--utama)", "var(--nila)", "var(--langit)", "var(--biru)"];
const app = document.getElementById("app");
let py, api, st, nama = "Pemain";
let keadaan = "jawab";          // jawab → (mediasi) → selesai, atau refleksi
let levelMediasi = 0, salahDipilih = new Set(), terakhir = null, idAI = 0;

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const panggil = (fn, ...a) => JSON.parse(api[fn](...a));
const $ = id => document.getElementById(id);

function simpanLokal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function bacaLokal(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
const cfgAI = () => { const c = bacaLokal("uc-ai", { penyedia: "gemini", api_key: "", model: "" }); if (c.penyedia !== "gemini") { c.penyedia = "gemini"; c.api_key = ""; c.model = ""; } return c; };

async function mulaiPython() {
  try {
    py = await loadPyodide();
    for (const f of ["soal.py", "permainan.py", "materi.py", "rmt.py", "ai_tutor.py", "web_api.py"]) {
      const r = await fetch(f);
      if (!r.ok) throw new Error("Gagal memuat " + f);
      py.FS.writeFile(f, await r.text());
    }
    api = py.pyimport("web_api");
    nama = bacaLokal("uc-nama", "Pemain");
    menu();
  } catch (e) {
    app.innerHTML = `<div class="tengah muat"><p><b>Aplikasi gagal dimuat.</b></p>
      <p class="kecil">${esc(e.message || e)}<br>Periksa koneksi internet lalu muat ulang halaman.</p></div>`;
  }
}

/* ------------------------------------------------------------- menu */
function menu() {
  const ai = cfgAI();
  const penyedia = JSON.parse(api.daftar_penyedia());
  app.innerHTML = `
    <div class="tengah">
      <div style="font-size:3rem">🛒</div>
      <h1>UntungCerdas</h1>
      <p class="sub">Game Literasi Matematika — Persentase Untung dan Rugi</p>
      <div class="nama"><label>Nama pemain: <input id="nama" maxlength="30" value="${esc(nama)}"></label></div>
      <div class="menu-tombol">
        <button class="tombol" onclick="mulai('kisi')">📝 Soal Kisi-kisi (4 Misi)</button>
        <button class="tombol langit" onclick="mulai('acak')">🎲 Latihan Soal Acak</button>
        <button class="tombol biru" onclick="materi()">📖 Pelajari Materi</button>
        <button class="tombol nila" onclick="papanSkor()">🏆 Papan Skor</button>
        <button class="tombol langit" onclick="pengaturanAI()">⚙️ Pengaturan AI</button>
      </div>
      <p class="kecil" style="margin-top:14px;color:${ai.api_key ? "var(--utama)" : "var(--redup)"}">
        ${ai.api_key ? "🤖 Tutor AI aktif (" + esc(penyedia[ai.penyedia]?.nama || ai.penyedia) + ")"
                     : "🤖 Tutor AI belum aktif — isi API key di ⚙️ Pengaturan AI"}</p>
      <p class="kecil catatan">Model pembelajaran: <b>Rigorous Mathematical Thinking (RMT)</b> • 4 misi literasi matematika • mediasi bertahap<br>
      Logika game ditulis dengan <b>Python</b> dan dijalankan langsung di browser.</p>
    </div>`;
}

function mulai(mode) {
  const n = $("nama");
  if (n) { nama = n.value.trim() || "Pemain"; simpanLokal("uc-nama", nama); }
  st = panggil("mulai", mode);
  orientasi();
}

function barAtas(denganSkor) {
  return `<div class="bar">
      <b>Misi ${st.i_misi + 1} dari ${st.jumlah_misi} • ${esc(st.mode)} • Model RMT</b>
      <span>${denganSkor ? '<span class="skor" id="skor"></span>' : ""}
        <button class="tombol abu" style="padding:6px 14px;margin-left:12px" onclick="keluar()">Menu</button></span>
    </div>`;
}
const lencana = m => `<span class="lencana" style="background:${WARNA[(m.nomor - 1) % 4]}">INDIKATOR ${m.nomor}: ${esc(m.indikator.toUpperCase())}</span>`;
const bagian = (judul, isi) => `<div class="bagian"><h3>${judul}</h3><p>${isi}</p></div>`;

/* ----------------------------------------------- RMT: orientasi misi */
function orientasi() {
  keadaan = "orientasi";
  const m = st.misi, r = st.rmt_misi;
  app.innerHTML = barAtas(false) + `
    <section class="kartu">
      ${lencana(m)}
      <h2 class="judul-misi" style="color:var(--utama);font-size:1.5rem">${esc(m.judul)}</h2>
      <p class="kecil" style="margin:0">Orientasi Misi — Pengalaman Belajar Ter-mediasi (MLE)</p>
      ${bagian("🎯 Tujuan Belajar (Intensionalitas)", esc(r.tujuan))}
      ${bagian("💡 Mengapa Ini Penting? (Makna)", esc(r.makna))}
      ${bagian("🔄 Dari Konsep Sehari-hari ke Konsep Matematika", esc(r.sehari_hari))}
      ${bagian("🔍 Analisis Tugas", r.analisis.map(a => "• " + esc(a)).join("<br>"))}
      ${bagian("🧭 Langkah Belajar (Learning Activity)", st.langkah_la.map(esc).join(" → ") +
        "<br>Setiap tahap diberi label fase kognitif: Input → Elaborasi → Output. Jika jawabanmu belum tepat, kamu akan dimediasi lalu boleh mencoba lagi.")}
    </section>
    <div class="aksi" style="justify-content:flex-end">
      <button class="tombol" onclick="layarMisi()">Saya Siap — Mulai Misi →</button>
    </div>`;
  window.scrollTo(0, 0);
}

/* ---------------------------------------------------------- tahapan */
function layarMisi() {
  const m = st.misi;
  app.innerHTML = barAtas(true) + `
    <div class="grid">
      <section class="kartu">
        ${lencana(m)}
        <h2 class="judul-misi">${esc(m.judul)}</h2>
        <p>${esc(m.soal)}</p>
        <b class="kecil">Tahapan Penyelesaian</b>
        <ul class="tahapan" id="tahapan"></ul>
      </section>
      <section class="kartu" id="kerja"></section>
    </div>`;
  layarTahap();
  window.scrollTo(0, 0);
}

function perbaruiStatus() {
  $("skor").textContent = `⭐ Skor: ${st.skor} / ${st.maks}`;
  $("tahapan").innerHTML = st.misi.tahapan.map((t, i) => {
    const label = `${t.judul.split(":")[0]} [${t.fase[0].toUpperCase() + t.fase.slice(1)}]`;
    if (t.hasil === null) {
      const aktif = i === st.i_tahap;
      return `<li class="${aktif ? "aktif" : ""}">${aktif ? "▶" : "○"} ${esc(label)} — skor ${t.skor}</li>`;
    }
    if (t.hasil === t.skor) return `<li class="ok">✔ ${esc(label)} — ${t.hasil}/${t.skor}</li>`;
    return `<li class="salah">✘ ${esc(label)} — ${t.hasil}/${t.skor}${t.ulang ? " (✔ setelah mediasi)" : ""}</li>`;
  }).join("");
}

function layarTahap() {
  keadaan = "jawab"; levelMediasi = 0; salahDipilih = new Set(); terakhir = null; idAI++;
  const t = st.tahap, r = st.rmt_tahap;
  let isi;
  if (t.jenis === "isian") {
    isi = t.isian.map((s, i) => `
      <div class="isian">
        <label for="isi${i}">${esc(s.label)}</label>
        ${s.satuan === "Rp" ? '<span class="kecil">Rp</span>' : ""}
        <input id="isi${i}" inputmode="decimal" autocomplete="off">
        ${s.satuan === "%" ? '<span class="kecil">%</span>' : ""}
        <span class="tanda" id="tanda${i}"></span>
      </div>`).join("") +
      `<p class="kecil">Tulis angka saja, misal 30000 atau 30.000; desimal pakai koma (17,65).</p>`;
  } else {
    isi = t.pilihan.map((p, i) => `
      <label class="opsi" id="opsi${i}"><input type="radio" name="pilih" value="${i}">
        <span><b>${"ABCD"[i]}.</b> ${esc(p)}</span></label>`).join("");
  }
  $("kerja").innerHTML = `
    <h2 class="judul-tahap">${esc(t.judul)}</h2>
    <p class="kecil" style="margin:0">Skor tahap ini: ${t.skor}</p>
    <div class="rmt-kotak"><b>🧠 Fase ${esc(r.fase_label)}</b><br>
      Operasi mental: ${esc(r.operasi)} • Alat psikologis: ${esc(r.alat)}<br>Fungsi kognitif: ${esc(r.fungsi)}</div>
    <p>${esc(t.perintah).replace(/\n/g, "<br>")}</p>
    ${isi}
    <div class="hasil" id="hasil" aria-live="polite"></div>
    <div class="mediasi tersembunyi" id="mediasi"></div>
    <div class="bahas tersembunyi" id="bahas"></div>
    <div class="ai tersembunyi" id="ai" aria-live="polite"></div>
    <div class="aksi">
      <span>
        <button class="tombol langit" id="periksa" onclick="periksa()">Periksa Jawaban</button>
        <button class="tombol nila" id="tombol-mediasi" onclick="tampilMediasi()">🧭 Mediasi</button>
        <button class="tombol biru" id="tombol-ai" onclick="mintaAI()">🤖 Mediator AI</button>
      </span>
      <button class="tombol" id="lanjut" onclick="lanjut()" disabled>Lanjut →</button>
    </div>`;
  perbaruiStatus();
  const pertama = $("isi0");
  if (pertama) pertama.focus();
}

/* RMT: pertanyaan terpimpin bertingkat (tanpa membocorkan jawaban) */
function tampilMediasi() {
  if (keadaan === "selesai") return;
  const daftar = st.rmt_tahap.mediasi;
  levelMediasi = Math.min(levelMediasi + 1, daftar.length);
  const el = $("mediasi");
  el.textContent = daftar.slice(0, levelMediasi).map((q, i) => `🧭 Mediasi ${i + 1}: ${q}`).join("\n");
  el.classList.remove("tersembunyi");
  if (levelMediasi >= daftar.length) $("tombol-mediasi").disabled = true;
}

function jawabanSaatIni() {
  if (st.tahap.jenis === "isian") return st.tahap.isian.map((_, i) => $("isi" + i).value);
  const r = document.querySelector('input[name="pilih"]:checked');
  return r ? Number(r.value) : -1;
}

function periksa() {
  if (keadaan !== "jawab" && keadaan !== "mediasi") return;
  const t = st.tahap, jawaban = jawabanSaatIni();
  const ulang = keadaan === "mediasi";
  const h = panggil("jawab", JSON.stringify(jawaban), ulang);
  const elHasil = $("hasil");
  if (h.error) { elHasil.style.color = "var(--redup)"; elHasil.textContent = h.error; return; }
  terakhir = h; st = h.status;
  if (t.jenis === "pilihan" && !h.benar) salahDipilih.add(jawaban);

  if (!ulang && !h.benar) return masukMediasi(h, jawaban);
  elHasil.style.color = h.benar ? "var(--hijau)" : "var(--merah)";
  elHasil.textContent = h.benar
    ? (ulang ? "✔ Tepat setelah mediasi! Kemampuanmu berkembang — dicatat sebagai potensi belajar." : `✔ Tepat! +${h.skor} skor`)
    : "✘ Masih belum tepat. Pelajari pembahasannya:";
  selesaikanTahap();
}

/* Uji → Mediasi → Uji ulang (LPAD Feuerstein). Kunci belum ditampilkan. */
function masukMediasi(h, jawaban) {
  keadaan = "mediasi";
  const t = st.tahap;
  if (t.jenis === "isian") {
    h.per_butir.forEach((ok, i) => {
      const el = $("tanda" + i);
      if (ok) { $("isi" + i).disabled = true; el.textContent = "✔"; el.style.color = "var(--hijau)"; }
      else { el.textContent = "✘ periksa lagi"; el.style.color = "var(--merah)"; }
    });
  } else {
    const r = document.querySelector(`input[name="pilih"][value="${jawaban}"]`);
    r.checked = false; r.disabled = true;
    $("opsi" + jawaban).classList.add("keliru");
  }
  const elHasil = $("hasil");
  elHasil.style.color = "var(--merah)";
  elHasil.textContent = `✘ Belum tepat (skor tahap 0/${t.skor}). Jangan menyerah — ikuti mediasi di bawah, lalu coba lagi sekali.`;
  tampilMediasi();
  $("periksa").textContent = "🔁 Coba Lagi";
  const l = $("lanjut"); l.disabled = false; l.textContent = "Lihat Pembahasan";
  perbaruiStatus();
}

function selesaikanTahap() {
  keadaan = "selesai";
  const t = st.tahap, h = terakhir;
  if (t.jenis === "isian") {
    h.per_butir.forEach((ok, i) => {
      $("isi" + i).disabled = true;
      const el = $("tanda" + i);
      el.textContent = ok ? "✔" : "✘ " + h.kunci_isian[i];
      el.style.color = ok ? "var(--hijau)" : "var(--merah)";
    });
  } else {
    document.querySelectorAll('input[name="pilih"]').forEach(r => r.disabled = true);
    $("opsi" + h.kunci_pilihan).classList.add("benar");
    salahDipilih.forEach(i => $("opsi" + i).classList.add("keliru"));
  }
  const bahas = $("bahas");
  bahas.textContent = "Pembahasan:\n" + h.penjelasan;
  bahas.classList.remove("tersembunyi");
  $("periksa").disabled = true;
  $("tombol-mediasi").disabled = true;
  $("tombol-ai").textContent = "🤖 Diagnosis AI";
  const l = $("lanjut");
  l.disabled = false;
  l.textContent = st.tahap_terakhir ? "Refleksi Misi →" : "Tahap Berikutnya →";
  l.focus();
  perbaruiStatus();
}

function lanjut() {
  if (keadaan === "mediasi") {
    const elHasil = $("hasil");
    elHasil.style.color = "var(--redup)";
    elHasil.textContent = "Pembahasan ditampilkan tanpa uji ulang.";
    return selesaikanTahap();
  }
  if (keadaan !== "selesai") return;
  if (st.tahap_terakhir) return refleksi();
  st = panggil("maju");
  layarTahap();
}

function keluar() { if (confirm("Akhiri permainan dan kembali ke menu?")) menu(); }

document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !$("kerja") || document.querySelector(".lapisan")) return;
  e.preventDefault();
  keadaan === "selesai" ? lanjut() : periksa();
});

/* ------------------------------------------ RMT: refleksi & transendensi */
function refleksi() {
  keadaan = "refleksi"; idAI++;
  const m = st.misi;
  const bintang = st.skor_misi === 6 ? 3 : st.skor_misi >= 4 ? 2 : st.skor_misi >= 2 ? 1 : 0;
  app.innerHTML = barAtas(false) + `
    <section class="kartu">
      <h2 style="color:var(--utama);margin:0">🪞 Refleksi & Transendensi — Misi ${m.nomor}</h2>
      <p class="kecil" style="margin:0">${esc(m.judul)} • Skor ${st.skor_misi}/6 <span class="bintang">${"★".repeat(bintang)}${"☆".repeat(3 - bintang)}</span></p>
      ${bagian("🌉 Transendensi — Prinsip Umum", esc(st.rmt_misi.transendensi))}
      <div class="bagian"><h3>🪞 Refleksi Diri (Metakognisi)</h3></div>
      <p style="margin:6px 0 2px">1. Fase berpikir mana yang paling menantang bagimu pada misi ini?</p>
      <div class="pilihan-refleksi">${st.opsi_refleksi_fase.map(([k, v]) =>
        `<label><input type="radio" name="rfase" value="${esc(k)}"> ${esc(v)}</label>`).join("")}</div>
      <p style="margin:10px 0 2px">2. Strategi apa yang paling membantumu?</p>
      <div class="pilihan-refleksi">${st.opsi_refleksi_strategi.map(v =>
        `<label><input type="radio" name="rstrategi" value="${esc(v)}"> ${esc(v)}</label>`).join("")}</div>
      <div class="hasil" id="hasil" style="color:var(--merah)"></div>
      <div class="ai tersembunyi" id="ai" aria-live="polite"></div>
    </section>
    <div class="aksi">
      <button class="tombol biru" id="tombol-ai" onclick="mintaAI()">🤖 Tanggapan AI atas Refleksiku</button>
      <button class="tombol" onclick="selesaiRefleksi()">${st.misi_terakhir ? "Lihat Hasil Akhir →" : "Misi Berikutnya →"}</button>
    </div>`;
  window.scrollTo(0, 0);
}

function refleksiTerpilih() {
  const f = document.querySelector('input[name="rfase"]:checked');
  const s = document.querySelector('input[name="rstrategi"]:checked');
  if (!f || !s) { $("hasil").textContent = "Jawab kedua pertanyaan refleksi terlebih dahulu."; return null; }
  return { fase: f.value, strategi: s.value };
}

function selesaiRefleksi() {
  const r = refleksiTerpilih();
  if (!r) return;
  panggil("simpan_refleksi", r.fase, r.strategi);
  st = panggil("maju");
  st.selesai ? hasilAkhir() : orientasi();
}

/* ------------------------------------------------------- tutor AI */
async function mintaAI() {
  const cfg = cfgAI();
  if (!cfg.api_key) {
    if (confirm("API key Gemini belum diisi. Buka Pengaturan AI sekarang?")) pengaturanAI();
    return;
  }
  let jenis, data = "-1", judul;
  if (keadaan === "refleksi") {
    const r = refleksiTerpilih();
    if (!r) return;
    jenis = "refleksi"; data = JSON.stringify(r); judul = "🤖 Tanggapan Mediator AI";
  } else if (keadaan === "selesai") {
    jenis = "penjelasan"; judul = "🤖 Diagnosis Mediator AI";
  } else {
    jenis = "petunjuk"; data = JSON.stringify(jawabanSaatIni()); judul = "🤖 Mediator AI";
  }
  const req = panggil("permintaan_ai", jenis, data, cfg.penyedia, cfg.model || "");
  const kotak = $("ai"), tombol = $("tombol-ai"), id = idAI;
  kotak.textContent = judul + "\nSedang berpikir…";
  kotak.classList.remove("tersembunyi");
  tombol.disabled = true;
  const teks = await kirimAI(req, cfg.api_key);
  if (id !== idAI || !document.body.contains(kotak)) return;
  kotak.textContent = judul + "\n" + teks;
  tombol.disabled = false;
}

async function kirimAI(req, key) {
  /* Server sibuk (5xx) → coba ulang otomatis; tetap sibuk / kuota habis (429) → model cadangan. */
  const jeda = ms => new Promise(r => setTimeout(r, ms));
  let terakhir = null, utama = null;
  try {
    for (const model of req.model) {
      for (let i = 0; i <= req.jumlah_coba_ulang; i++) {
        const r = await fetch(req.url, {
          method: "POST",
          headers: { ...req.headers, Authorization: "Bearer " + api.bersihkan_key(key) },
          body: JSON.stringify({ ...req.body, model }),
        });
        if (r.ok) {
          const h = JSON.parse(api.ambil_teks_ai(await r.text()));
          return h.error ? "⚠️ " + h.error : h.teks;
        }
        terakhir = { kode: r.status, isi: await r.text() };
        if (req.kode_coba_ulang.includes(r.status) && i < req.jumlah_coba_ulang) {
          await jeda(req.jeda * 1000 * (i + 1));
          continue;
        }
        break;
      }
      if (!utama) utama = terakhir;
      if (!req.kode_coba_ulang.includes(terakhir.kode) && terakhir.kode !== 429) break;
    }
    if ((terakhir.kode === 400 || terakhir.kode === 404) && utama) terakhir = utama;
  } catch (e) {
    return "⚠️ Tidak dapat terhubung ke server AI. Periksa koneksi internet, lalu coba lagi.";
  }
  let pesan = api.galat_http(terakhir.kode, terakhir.isi);
  const saran = api.cek_format_key(key);
  if (pesan.includes("tidak valid") && saran) pesan += " " + saran;
  return "⚠️ " + pesan;
}

function pengaturanAI() {
  const cfg = cfgAI(), penyedia = JSON.parse(api.daftar_penyedia());
  const lapisan = document.createElement("div");
  lapisan.className = "lapisan";
  lapisan.innerHTML = `
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="judul-ai">
      <h2 id="judul-ai" style="color:var(--utama);margin:0">⚙️ Pengaturan Tutor AI</h2>
      <p class="kecil">Masukkan API key <b>Google Gemini</b> (gratis, buat di <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>) agar aplikasi bisa memberi mediasi, diagnosis, dan tanggapan refleksi.
        Key hanya disimpan di browser perangkat ini dan tidak dikirim ke mana pun selain penyedia AI yang dipilih.</p>
      <label for="ai-penyedia">Penyedia</label>
      <select id="ai-penyedia">${Object.entries(penyedia).map(([k, v]) =>
        `<option value="${esc(k)}" ${k === cfg.penyedia ? "selected" : ""}>${esc(v.nama)}</option>`).join("")}</select>
      <label for="ai-key">API key</label>
      <input id="ai-key" type="password" autocomplete="off" value="${esc(cfg.api_key)}">
      <label style="font-weight:400"><input type="checkbox" id="ai-lihat" style="width:auto"> Tampilkan key</label>
      <label for="ai-model">Model (kosongkan untuk bawaan)</label>
      <input id="ai-model" value="${esc(cfg.model)}" placeholder="">
      <p class="kecil" id="ai-bawaan"></p>
      <div class="hasil" id="ai-status" style="font-size:.95rem"></div>
      <div class="aksi">
        <button class="tombol langit" id="ai-tes">Tes Koneksi</button>
        <span><button class="tombol abu" id="ai-batal">Batal</button>
        <button class="tombol" id="ai-simpan">Simpan</button></span>
      </div>
    </div>`;
  document.body.appendChild(lapisan);
  const ambil = () => ({ penyedia: $("ai-penyedia").value, api_key: api.bersihkan_key($("ai-key").value), model: $("ai-model").value.trim() });
  const bawaan = () => { $("ai-bawaan").textContent = "Model bawaan: " + penyedia[$("ai-penyedia").value].model; };
  bawaan();
  $("ai-penyedia").onchange = bawaan;
  $("ai-lihat").onchange = e => { $("ai-key").type = e.target.checked ? "text" : "password"; };
  const tutup = () => lapisan.remove();
  $("ai-batal").onclick = tutup;
  lapisan.addEventListener("keydown", e => { if (e.key === "Escape") tutup(); });
  $("ai-simpan").onclick = () => { simpanLokal("uc-ai", ambil()); tutup(); if (!$("kerja") && keadaan !== "refleksi" && keadaan !== "orientasi") menu(); };
  $("ai-tes").onclick = async () => {
    const c = ambil(), s = $("ai-status");
    if (!c.api_key) { s.style.color = "var(--merah)"; s.textContent = "Isi API key terlebih dahulu."; return; }
    s.style.color = "var(--redup)"; s.textContent = "Menghubungi AI…";
    const teks = await kirimAI(panggil("permintaan_tes", c.penyedia, c.model), c.api_key);
    const ok = !teks.startsWith("⚠️");
    s.style.color = ok ? "var(--hijau)" : "var(--merah)";
    s.textContent = ok ? "✔ Berhasil terhubung! Jawaban AI: " + teks : "✘ " + teks.replace("⚠️ ", "");
  };
  $("ai-key").focus();
}

/* ------------------------------------------------------------- hasil */
function hasilAkhir() {
  keadaan = "hasil";
  const daftar = bacaLokal("uc-skor", []);
  const entri = { nama, nilai: st.nilai, skor: st.skor, mode: st.mode, tanggal: new Date().toISOString().slice(0, 10), baru: true };
  daftar.push(entri);
  daftar.sort((a, b) => b.nilai - a.nilai || b.skor - a.skor);
  const top = daftar.slice(0, 10);
  const peringkat = top.indexOf(entri) + 1;
  top.forEach(e => delete e.baru);
  simpanLokal("uc-skor", top);

  const lemah = st.misi.filter(m => m.skor < m.maks).map(m => m.indikator);
  const refleksi = st.refleksi.map((r, i) => r ? `Misi ${i + 1}: sulit di ${r}` : null).filter(Boolean);
  app.innerHTML = `
    <div class="tengah">
      <div style="font-size:3rem">${st.nilai >= 75 ? "🏆" : "📚"}</div>
      <h1 style="font-size:2rem">Semua Misi Selesai!</h1>
      <p style="font-size:1.8rem;font-weight:700;margin:6px 0 0">Nilai ${esc(nama)}: ${st.nilai}</p>
      <p class="sub">Skor ${st.skor} dari ${st.maks} • Predikat ${esc(st.predikat)}</p>
    </div>
    <div class="kartu tabel-gulir">
      <table>
        <tr><th>No</th><th>Indikator</th><th>Soal</th><th>Skor</th><th>Capaian</th></tr>
        ${st.misi.map(m => `<tr><td>${m.nomor}</td><td>${esc(m.indikator)}</td><td>${esc(m.judul)}</td>
          <td>${m.skor} / ${m.maks}</td><td class="bintang">${"★".repeat(m.bintang)}${"☆".repeat(3 - m.bintang)}</td></tr>`).join("")}
      </table>
    </div>
    <section class="kartu" style="margin-top:14px;background:var(--lembut)">
      <h2 style="color:var(--biru);margin:0 0 8px;font-size:1.2rem">🧠 Profil Fungsi Kognitif (Model RMT)</h2>
      ${st.profil.map(p => `<div class="profil-baris"><span>${esc(p.fase)}</span>
        <div class="batang"><span style="width:${p.maks ? p.dapat * 100 / p.maks : 0}%"></span></div>
        <span>${p.dapat}/${p.maks} (${p.maks ? Math.round(p.dapat * 100 / p.maks) : 0}%)</span></div>`).join("")}
      <p>📈 Asesmen dinamis (Uji – Mediasi – Uji ulang): skor awal ${st.skor}/${st.maks} → setelah mediasi
        <b>${st.skor_mediasi}/${st.maks}</b> (${st.jumlah_mediasi} kali uji ulang).</p>
      <p>${st.fase_lemah ? `🎯 Fase yang perlu dilatih: <b>${esc(st.fase_lemah)}</b>.<br>${esc(st.rekomendasi)}`
                         : "✅ Semua fase kognitif sudah sangat baik. Pertahankan cara berpikir yang teliti!"}</p>
      ${refleksi.length ? `<p class="kecil">🪞 Refleksimu — ${esc(refleksi.join("; "))}.</p>` : ""}
    </section>
    <div class="tengah">
      <p>${lemah.length ? "Perlu latihan lagi pada indikator: " + esc(lemah.join("; ")) + "." : "Sempurna! Semua indikator literasi matematika tercapai."}</p>
      ${peringkat ? `<p style="color:var(--nila);font-weight:700">Kamu masuk papan skor di peringkat #${peringkat}!</p>` : ""}
      <button class="tombol langit" onclick="mulai('${st.mode === "Soal Kisi-kisi" ? "kisi" : "acak"}')">Ulangi</button>
      <button class="tombol biru" onclick="mulai('acak')">Latihan Acak</button>
      <button class="tombol abu" onclick="menu()">Menu</button>
    </div>`;
  window.scrollTo(0, 0);
}

/* ------------------------------------------------------------- materi */
function materi() {
  keadaan = "materi";
  const data = panggil("materi");
  app.innerHTML = `
    <h1 style="color:var(--biru);font-size:1.8rem">📖 Materi: Persentase Untung dan Rugi</h1>
    <div class="materi" style="margin-top:14px">
      <nav>${data.map((m, i) => `<button onclick="tampilMateri(${i})">${esc(m.judul)}</button>`).join("")}</nav>
      <section class="kartu"><h2 id="mjudul" style="color:var(--biru);margin-top:0"></h2><pre id="isi-materi"></pre></section>
    </div>
    <p><button class="tombol abu" onclick="menu()">← Kembali</button></p>`;
  window._materi = data;
  tampilMateri(0);
}
function tampilMateri(i) {
  document.querySelectorAll(".materi nav button").forEach((b, j) => b.classList.toggle("aktif", i === j));
  $("mjudul").textContent = window._materi[i].judul;
  $("isi-materi").textContent = window._materi[i].isi;
}

/* ------------------------------------------------------------- papan skor */
function papanSkor() {
  keadaan = "skor";
  const data = bacaLokal("uc-skor", []);
  app.innerHTML = `
    <h1 style="color:var(--nila);font-size:1.8rem" class="tengah">🏆 Papan Skor</h1>
    <p class="kecil tengah">Skor tersimpan di browser perangkat ini.</p>
    <div class="kartu tabel-gulir">
      <table>
        <tr><th>#</th><th>Nama</th><th>Nilai</th><th>Skor</th><th>Mode</th><th>Tanggal</th></tr>
        ${data.length ? data.map((e, i) => `<tr><td>${i + 1}</td><td>${esc(e.nama)}</td><td><b>${e.nilai}</b></td>
          <td>${e.skor}/24</td><td>${esc(e.mode)}</td><td>${esc(e.tanggal)}</td></tr>`).join("")
          : `<tr><td colspan="6" class="tengah kecil">Belum ada skor. Ayo main!</td></tr>`}
      </table>
    </div>
    <p class="tengah"><button class="tombol abu" onclick="menu()">← Kembali</button></p>`;
}
